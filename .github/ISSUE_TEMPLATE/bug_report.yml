name: Bug report
description: The package does not install, load or round the blur as documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove machine names, user names and personal paths from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: After installing the package and logging back in, Blur my Shell still shows square corners.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `lsb_release -ds; gnome-shell --version; dpkg -l gnome-rounded-blur 'libmutter-*-0' | tail -n +6`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines from `journalctl --user -b | grep -iE 'blur|gjs'`, scrubbed.
      render: text
